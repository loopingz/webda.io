<text x="48" y="57" font-size="32" font-weight="650">Emit now. Handle in a worker.</text>
<text x="48" y="92" class="detail" text-anchor="start">AsyncEvents bridges service events and queued background work.</text>
<rect x="48" y="125" width="1104" height="99" rx="16" fill="var(--pale)"/>
<text x="72" y="162" class="hook" text-anchor="start">1  Register with bindAsyncListener(service, event, callback)</text>
<text x="72" y="198" class="detail" text-anchor="start">Attach a queue-send listener to the emitter; keep the original callback for the worker.</text>
<path d="M428 224 V253 H154 V282" class="line" marker-end="url(#arrow)" stroke-dasharray="7 7"/>
<text x="640" y="259" class="small" text-anchor="middle">Registration happens before events are emitted.</text>
