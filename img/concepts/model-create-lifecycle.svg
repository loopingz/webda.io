<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 787" role="img" aria-labelledby="title description">
<title id="title">Create a model: prepare, authorize, persist.</title>
<desc id="description">Create a model: prepare, authorize, persist.. Create request: REST transport → domain operation, Load and sanitize the input. Prepare model: Build the model instance, Run prepareCreate(context). Authorize create: Check the model permission, Continue only when allowed. Before persistence: Repository emits Create, Listeners receive the model and key. Persist the record: Underlying repository.create(), Write through the configured backend. After persistence: Repository emits Created, Return the saved model to the client. Create and Created are typed repository events; they surround the underlying create operation. The transport returns a successful create response only after the operation completes.</desc>
