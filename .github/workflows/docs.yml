name: "update docs"

# Builds the documentation site (guides + typedoc) and deploys it to GitHub Pages.
# Runs after each release (called by release-please.yml) and can be run by hand to republish:
#   gh workflow run docs.yml                 (current main)
#   gh workflow run docs.yml -f ref=<sha|tag|branch>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to build the docs from (default: the branch the workflow runs on)"
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: "Commit to build the docs from"
        type: string
        required: false

permissions:
  contents: write

# One deployment at a time; a newer one supersedes a pending one
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_COLOR: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # docs is a workspace package, so this installs its dependencies too;
      # typedoc resolves cross-package types through each package's compiled lib/
      - name: Build packages
        run: pnpm install && pnpm run build

      - name: Build docs
        timeout-minutes: 45
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm run docs

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          # docusaurus build output (the docs script writes the CNAME there)
          folder: docs/build
