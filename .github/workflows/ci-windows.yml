# Build and test the framework packages that do not require external services on Windows
# Cloud integrations (aws, gcp, mongodb, postgres, ...) rely on Linux service containers and run in ci.yml
name: "CI Windows"

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 6 * * *" # Daily run on the older Node version, UTC
  # On demand, e.g. before a release
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event_name }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes test the latest Node, the daily and on demand runs the older one
        node: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["22"]' || '["26"]') }}
    name: Build with NodeJS v${{ matrix.node }} on Windows
    env:
      FORCE_COLOR: 1
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      # Keep LF line endings: tests compare generated files with fixtures
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install

      # Sample apps are loaded by core and content-mapper tests (including their generated .webda/module.d.ts)
      - name: Build
        run: >-
          pnpm --workspace-concurrency=1
          --filter "@webda/core..."
          --filter "@webda/sample-app..."
          --filter "@webda/sample-blog-system..."
          run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run tests
        run: node scripts/run-affected-tests.mjs test "$env:PR_BASE_SHA" --windows
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
