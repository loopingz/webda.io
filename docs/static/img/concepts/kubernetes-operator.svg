<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 761" role="img" aria-labelledby="title description">
<title id="title">Reconcile desired state</title>
<desc id="description">Reconcile desired state. Watching: Leader receives changes or resync. Queued: Added or spec changed, One task at a time per object. Reconciling: Run the model’s reconcile(). Finalizing: On deletionTimestamp: finalize(), Remove finalizer to finish deletion. Backoff: On error: delay, then queue again. Update status: Success: observedGeneration + Ready, Return to watching. Success returns to Watching; errors return to Queued after backoff. Deletion follows the finalizer path.</desc>
