<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 787" role="img" aria-labelledby="title description">
<title id="title">Application identity across a trust boundary</title>
<desc id="description">App A obtains an audience-bound token from its issuer or an external issuer. App B resolves the Bearer token, verifies it with trusted issuer keys, creates a stateless application session, and checks IAM permissions.</desc>
