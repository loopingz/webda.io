<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 761" role="img" aria-labelledby="title description">
<title id="title">Models as Kubernetes resources</title>
<desc id="description">Models as Kubernetes resources. Model definition: Fields and model metadata. Export CRD: webda kubernetes crd export. CRD YAML: CustomResourceDefinition. Application: Model.create / useRepository. KubernetesRepository: CustomObjectsApi. Kubernetes API: kube-apiserver / etcd. Top: install the resource schema. Bottom: create and retrieve model instances at runtime.</desc>
