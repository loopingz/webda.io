<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 787" role="img" aria-labelledby="title description">
<title id="title">Webda runtime: responsibilities and connections</title>
<desc id="description">Webda runtime: responsibilities and connections. Application layer: Application / UnpackedApplication, Discover modules; load configuration. Core runtime: Lifecycle and dependency graph, InstanceStorage + core events. HTTP / request layer: HttpServer, Router, WebContext, SessionManager and transports. Services layer: Service + typed parameters, Crypto, binary, domain services. Data layer: Repositories and storage backends, MemoryStore + framework Registry. Shared infrastructure: Logging, metrics, caches, Typed errors across the runtime. These are responsibility groups, not a request sequence; shared infrastructure supports every runtime layer. Models own domain behavior; services coordinate integrations and work across models.</desc>
