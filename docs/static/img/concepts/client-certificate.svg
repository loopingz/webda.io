<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
<title id="title">Client certificates: two entry paths, one identity flow</title>
<desc id="description">In native mode the client presents a certificate directly to Webda HttpServer over TLS. In proxy mode a reverse proxy verifies the client certificate and forwards it; Webda accepts the header only from trusted proxies. HttpContext exposes the certificate. In login mode SessionManager uses CertificateProvider to resolve an accepted certificate to a user and create a stateless session. Factor mode instead augments an existing matching session.</desc>
