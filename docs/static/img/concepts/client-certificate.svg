<text x="48" y="828" class="label" text-anchor="start">Proxy trust boundary</text>
<text x="48" y="864" class="small" text-anchor="start">Verify at the proxy and restrict access to Webda.</text>
<text x="48" y="894" class="small" text-anchor="start">A forwarded header is not proof on its own.</text>
<text x="663" y="828" class="label" text-anchor="start">Using factor mode?</text>
<text x="663" y="864" class="small" text-anchor="start">Requires an existing session for the same user.</text>
<text x="663" y="894" class="small" text-anchor="start">Adds mtls for this request; does not log in alone.</text>
