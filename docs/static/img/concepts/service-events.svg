<text x="153" y="451" class="label" text-anchor="middle">Service</text>
<text x="153" y="484" class="small" text-anchor="middle">Emits the event</text>
<text x="443" y="451" class="label" text-anchor="middle">AsyncEvents</text>
<text x="443" y="484" class="small" text-anchor="middle">Wraps the event payload</text>
<text x="733" y="451" class="label" text-anchor="middle">Queue</text>
<text x="733" y="484" class="small" text-anchor="middle">Holds serialized events</text>
<text x="1023" y="451" class="label" text-anchor="middle">Worker</text>
<text x="1023" y="484" class="small" text-anchor="middle">Revives and dispatches</text>
<path d="M273 344 H351" class="line" marker-end="url(#arrow)"/>
<text x="312.0" y="321" class="small" text-anchor="middle">2  emit()</text>
<path d="M563 344 H641" class="line" marker-end="url(#arrow)"/>
<text x="602.0" y="321" class="small" text-anchor="middle">3  send</text>
<path d="M853 344 H931" class="line" marker-end="url(#arrow)"/>
<text x="892.0" y="321" class="small" text-anchor="middle">4  consume</text>
<path d="M1023 507 V544" class="line" marker-end="url(#arrow)"/>
<rect x="824" y="553" width="328" height="95" rx="14" fill="var(--pale)" stroke="var(--stop)"/>
<text x="988" y="591" class="label" text-anchor="middle">5  Original callbacks</text>
<text x="988" y="625" class="small" text-anchor="middle">Worker awaits their promises</text>
<rect x="48" y="538" width="710" height="110" rx="14" fill="var(--pale)" stroke="var(--sync)"/>
<text x="72" y="578" class="label" text-anchor="start">What does await emit() wait for?</text>
<text x="72" y="612" class="detail" text-anchor="start">The queue-send promise — not the worker’s callbacks.</text>
<path d="M48 691 H1152" class="line" opacity=".35"/>
<text x="48" y="733" class="label" text-anchor="start">Event envelope</text>
<text x="48" y="770" class="detail" text-anchor="start">service · type · payload · time</text>
<text x="657" y="733" class="label" text-anchor="start">Core events are different</text>
<text x="657" y="770" class="detail" text-anchor="start">emitCoreEvent() is fire-and-forget (void).</text>
