<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
<title id="title">Dynamic configuration: refresh, compare, apply</title>
<desc id="description">Provider notifications or a polling interval trigger a refresh. ConfigurationService reads sources in order, merges defaults and compares the result with the previous configuration. Unchanged values wait for the next refresh. Changed values are decrypted and passed to Core, which loads changed service parameters while preserving service types.</desc>
