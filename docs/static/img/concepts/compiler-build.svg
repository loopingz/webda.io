<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 787" role="img" aria-labelledby="title description">
<title id="title">From TypeScript to an application contract</title>
<desc id="description">From TypeScript to an application contract. TypeScript source: src/**/*.ts, Models, services, and operations. Compile: content-mapper build, Emit ES modules to lib/**/*.js. Analyze the program: content-mapper module, Discover model and service metadata. Generate schemas: Model input / output / stored, Service parameter schemas. Write manifest: webda.module.json, Application metadata and schemas. Configuration schema: .webda/config.schema.json, Include dependency manifests. Installed node_modules/**/webda.module.json files also contribute to the configuration schema. Generated artifacts are build outputs: edit the TypeScript source, then rebuild.</desc>
