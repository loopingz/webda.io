<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 761" role="img" aria-labelledby="title description">
<title id="title">Queued action execution</title>
<desc id="description">Queued action execution. Create action: API saves QUEUED in the store. Enqueue: API publishes the action, Worker retrieves the queue item. Start action: Worker saves STARTING, Then asks the runner to execute. Launch job: Runner starts the job, Returns job info to the worker. Save job info: Worker persists runner metadata. Report status repeatedly: Job calls API /async/status, API updates the store. Status callbacks go through the API; the worker handles launch and runner metadata.</desc>
