<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">Async events: emit now, handle in a worker</title>
<desc id="description">AsyncEvents registers a queue-send listener on a service and stores the original callback. The service emits an event, AsyncEvents sends its serialized envelope to a queue, and a worker consumes and revives it before calling the registered callbacks. Awaiting emit waits for enqueueing, not for worker callback completion.</desc>
