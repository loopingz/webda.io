<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1052" role="img" aria-labelledby="title description">
<title id="title">The states of a service</title>
<desc id="description">The states of a service. initial: Constructor creates the instance, Synchronous setup only. resolving: resolve() begins, Wire injected dependencies. resolved: resolve() completes, Ready for asynchronous startup. initializing: init() begins, Open connections and start tasks. running: init() completes, Handle requests or background work. stopping: Core.stop() invokes stop(), Release owned resources. stopped: stop() completes, Cleanup has finished. This is the service state machine. Core uses ready for its initialized state and also supports reinitializing. The arrows show ordering, not elapsed time.</desc>
