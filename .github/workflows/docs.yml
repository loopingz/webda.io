name: "update docs"

# Builds the documentation site (guides + typedoc) and deploys it to GitHub Pages.
# Runs after each release (called by release-please.yml) and can be run by hand to republish:
#   gh workflow run docs.yml -f ref=maintenance/v3.x -f lane=v3
# Merge a fix into its maintenance branch before republishing that lane.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to build the docs from (default: the branch the workflow runs on)"
        type: string
        required: false
      lane:
        description: "Documentation lane to publish"
        type: choice
        options: [v3]
        default: v3
  workflow_call:
    inputs:
      ref:
        description: "Commit to build the docs from"
        type: string
        required: false
      lane:
        description: "Documentation lane to publish"
        type: string
        required: false
        default: v3

permissions:
  contents: write

concurrency:
  group: docs-deploy-v3
  cancel-in-progress: false

jobs:
  docs:
    name: Build and deploy docs
    if: ${{ inputs.lane == 'v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_COLOR: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          # mermaid 12 (through @docusaurus/theme-mermaid) needs Node 22.12 or newer
          node-version: 22

      - name: Build v3 packages
        run: yarn install && yarn run build && (cd docs && yarn install)

      - name: Build v3 docs
        timeout-minutes: 45
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          DOCS_BASE_URL: /v3/
        run: yarn docs

      - name: Remove root-only assets
        run: rm -f docs/build/CNAME docs/build/versions.json docs/build/sitemap.xml

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          target-folder: v3
          clean: true
          # Concurrent lanes share gh-pages; retry by rebasing instead of force-pushing.
          force: false
          attempt-limit: 5
          folder: docs/build
