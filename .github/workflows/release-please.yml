on:
  push:
    branches:
      - main
      - maintenance/v3
  workflow_dispatch:
    inputs:
      publish_ref:
        description: "Release tag to build and publish without a new release (e.g. core-v4.0.0-beta.3), to recover from a skipped or failed publish"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # In a monorepo `release_created` only covers the root package; `releases_created` covers all
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: ${{ github.ref_name }}

      - name: Checkout repository
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_ref || github.sha }}

      # The release scripts come from the workflow commit, which can be newer than `publish_ref`
      - name: Checkout release scripts
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_ref }}
        uses: actions/checkout@v4
        with:
          path: .release-tools
          sparse-checkout: scripts/publish-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_ref }}
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_ref }}

      - name: Build
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_ref }}
        run: pnpm install && pnpm run build

      # Publishes only the packages tagged on this commit, each under its own dist-tag (beta, rc... or latest)
      - name: Publish project
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_ref }}
        run: .release-tools/scripts/publish-release.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A one-shot `release-as` (set by `pnpm release-as`) is removed inside the release PR,
      # so merging the release clears it from the base branch. release-please rewrites its
      # branch whenever the base branch moves, so this is re-applied on every update.
      - name: Checkout release PR
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          path: release-pr

      - name: Clear release-as in release PR
        if: ${{ steps.release.outputs.pr }}
        working-directory: release-pr
        run: |
          RELEASE_AS=$(jq -r '."release-as" // empty' release-please-config.json)
          if [ -n "$RELEASE_AS" ]; then
            jq 'del(."release-as")' release-please-config.json > release-please-config.tmp
            mv release-please-config.tmp release-please-config.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: clear release-as $RELEASE_AS"
            git push
          fi

  # Docs are built from this workflow's commit, so a publish_ref recovery still gets current docs
  docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || inputs.publish_ref }}
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.sha }}
