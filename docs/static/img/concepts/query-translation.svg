<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 787" role="img" aria-labelledby="title description">
<title id="title">One query language. Multiple storage backends.</title>
<desc id="description">One query language. Multiple storage backends.. WQL query: Filter, ordering, pagination, Example: status = published. Parser / validator: @webda/ql · QueryValidator, Build a validated expression tree. Expression AST: AndExpression, ComparisonExpression, and more. MemoryStore: Evaluate expressions per object, In-memory filtering. MongoStore: Translate into a MongoDB filter, Execute against the collection. SQLStore: Translate into SQL predicates, Execute against the database. The three backend paths are alternatives; a query goes to its configured store. Translation support and backend-specific behavior are detailed below.</desc>
