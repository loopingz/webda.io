<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 787" role="img" aria-labelledby="title description">
<title id="title">Start in order. Stop together.</title>
<desc id="description">Start in order. Stop together.. Launch application: CLI creates Core(application), Calls Core.init(). Create + resolve services: Construct service instances, Resolve dependencies on demand. Choose init order: Finalize initOrders, Stores before other services. Initialize services: Await init() in the selected order, Connections and background tasks. Run application: Serve requests and operations, Until shutdown is requested. Stop concurrently: Core invokes service stop() hooks, Await their completion together. Shutdown does not promise a service-by-service order. Do not assume another service is still running. Call super.resolve(), await super.init(), and await super.stop() in the corresponding hooks.</desc>
